name: Daily AI Curation

on:
  schedule:
    - cron: "0 23 * * *"   # KST 08:00 (UTC 23:00)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Collect news (keyless)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUMMARY_MODEL: nousresearch/hermes-3-llama-3.1-405b:free
        run: python scripts/curate.py

      - name: Build static site
        run: python scripts/build.py

      - name: Commit results
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add data/ index.html archive.html issues/ assets/ || true
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: daily curation $(date +%Y-%m-%d)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
