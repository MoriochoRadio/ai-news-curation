name: Daily AI Curation

on:
  schedule:
    # KST 07:23 — 정각은 GitHub 스케줄 혼잡 시간대라 피하고, 평균 2시간대 지연을 감안해 앞당겼다
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      alert: ${{ steps.curate.outputs.alert }}
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      # 요약 모델은 실행 때마다 OpenRouter 무료 모델 목록에서 자동으로 고른다.
      # 특정 모델로 고정하려면 SUMMARY_MODEL 환경변수를 추가하면 된다(선택).
      - name: Collect news (keyless)
        id: curate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # GitHub 검색 API 한도(비인증 분당 10회)를 넉넉히 — 스크립트는 공개 검색 조회에만 쓴다
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/curate.py

      - name: Build static site
        run: python scripts/build.py

      # 결과를 main 에 push 해야 지난 호가 남고(아카이브·호별 링크),
      # 레포 활동이 이어져 60일 무활동 스케줄 자동 비활성화도 피한다.
      - name: Commit and push results
        id: commit
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add data/ index.html archive.html issues/ assets/ || true
          if git diff --cached --quiet; then
            echo "no changes"; echo "pushed=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "chore: daily curation $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed=yes" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 15))
          done
          echo "::warning::push 3회 실패 — 오늘 호는 배포되지만 저장소에는 남지 않습니다"
          echo "pushed=no" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 사람이 손봐야 할 때만 실패한다(→ GitHub 이 소유자에게 실패 메일을 보냄).
  # 발행·배포가 끝난 뒤에 돌기 때문에 알림이 사이트 갱신을 막지 않는다.
  health:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check pipeline health
        env:
          ALERT: ${{ needs.build.outputs.alert }}
          PUSHED: ${{ needs.build.outputs.pushed }}
        run: |
          fail=0
          if [ -n "$ALERT" ]; then echo "::error::$ALERT"; fail=1; fi
          if [ "$PUSHED" = "no" ]; then echo "::error::결과 push 실패 — 저장소 권한/보호 규칙 확인 필요"; fail=1; fi
          [ "$fail" = 0 ] && echo "정상 — 조치할 것 없음"
          exit $fail
